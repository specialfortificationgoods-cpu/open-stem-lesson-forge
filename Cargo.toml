[workspace]
members = [
    "crates/lessonforge_api",
    "crates/lessonforge_core",
    "crates/lessonforge_runner",
    "crates/lessonforge_schema",
    "crates/lessonforge_validator",
    "tools/verify-no-inference-core",
    "tools/verify-no-leak-fixtures",
    "tools/verify-schema-fixtures",
    "tools/lessonforge-e2e",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unwrap_used = "deny"

[workspace.dependencies]
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
getrandom = "0.4.2"
hmac = "0.12.1"
libc = "0.2.177"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10.9"
subtle = "2.6.1"
tempfile = "3.24.0"
thiserror = "2.0.17"
cargo_metadata = "0.23.1"
